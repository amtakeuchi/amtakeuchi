<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 172" width="700" height="172">
  <defs>
    <clipPath id="type-reveal">
      <rect x="54" y="38" width="0" height="16">
        <animate attributeName="width" begin="0.5s" dur="0.9s" fill="freeze" calcMode="discrete"
          values="0;8;15;23;30;38;46" />
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="699" height="171" rx="16" fill="#0a0b0d" stroke="#1a1c20"></rect>

  <!-- terminal prompt, all one green -->
  <text x="26" y="30" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#3fd07f">┌──(amtakeuchi㉿securi-tee)─[~]</text>
  <text x="26" y="50" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#3fd07f">└─$</text>
  <text x="54" y="50" clip-path="url(#type-reveal)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#3fd07f">whoami</text>
  <!-- blinking block cursor, appears after typing finishes -->
  <rect x="103" y="39" width="8" height="14" fill="#3fd07f" opacity="0">
    <animate attributeName="opacity" begin="1.5s" dur="1.1s" values="1;1;0;0" keyTimes="0;0.5;0.5;1" repeatCount="indefinite" />
  </rect>

  <!-- name with rgb-split glitch flashes -->
  <text x="24" y="98" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#ec5f57" opacity="0">Adam Takeuchi<animate attributeName="opacity" begin="2.2s" dur="7s" values="0;0;0.85;0;0;0;0.7;0;0" keyTimes="0;0.30;0.32;0.34;0.60;0.62;0.64;0.66;1" repeatCount="indefinite" /></text>
  <text x="28" y="98" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#5b9df0" opacity="0">Adam Takeuchi<animate attributeName="opacity" begin="2.2s" dur="7s" values="0;0;0.8;0;0;0;0.75;0;0" keyTimes="0;0.31;0.33;0.35;0.61;0.63;0.65;0.67;1" repeatCount="indefinite" /></text>
  <text x="26" y="98" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#f4f6f8">Adam Takeuchi</text>

  <text x="26" y="122" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="#7c8894">CYBERSECURITY CONSULTANT &amp; RESEARCHER · <tspan fill="#ec5f57">OFFENSE</tspan> ⇄ <tspan fill="#5b9df0">DEFENSE</tspan></text>

  <text x="26" y="144" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a2abb6"><tspan x="26" dy="0">I work in the space between offense and defense — figuring out</tspan><tspan x="26" dy="18">how things break, then helping build them back harder to break.</tspan></text>
</svg>
